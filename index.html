<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE WEBSITE IN PROGRESS — Build With Your Voice</title>
<style>
:root{--bg:#080808;--panel:#101010;--panel2:#151515;--ink:#f4f1e9;--muted:#777;--accent:#c8ff44;--line:#252525}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button,input,select{font:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-rows:64px 1fr 42px}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(8,8,8,.9);backdrop-filter:blur(14px);z-index:5}.brand{display:flex;gap:12px;align-items:center}.dot{width:10px;height:10px;background:var(--accent);border-radius:50%;box-shadow:0 0 22px var(--accent)}.brand b{font-size:11px;letter-spacing:.16em}.brand span{font-size:9px;color:var(--muted);letter-spacing:.12em}.actions{display:flex;gap:7px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 11px;font-size:9px;letter-spacing:.1em}.btn.primary{background:var(--accent);color:#050505;border-color:var(--accent);font-weight:900}.btn.active{border-color:var(--accent);color:var(--accent)}
.studio{min-height:0;display:grid;grid-template-columns:170px 1fr 280px}.rail{background:#0c0c0c;min-height:0;overflow:auto}.left{border-right:1px solid var(--line);padding:14px}.right{border-left:1px solid var(--line);padding:14px}.label{font-size:8px;letter-spacing:.18em;color:#666;margin:4px 0 10px}.pages{display:grid;gap:5px;margin-bottom:22px}.page{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:#aaa;padding:10px;border-radius:8px;font-size:10px}.page.active{background:#151515;color:var(--ink);border-color:#2b2b2b}.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.tool{padding:11px 6px;border:1px solid var(--line);background:#111;color:#aaa;border-radius:8px;font-size:9px}.tool:hover{border-color:var(--accent);color:var(--ink)}.themes{display:grid;gap:6px}.theme{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;color:#aaa;padding:7px;border-radius:8px;font-size:9px}.theme:hover{border-color:var(--line)}.swatch{width:16px;height:16px;border-radius:50%;border:1px solid #333}
.workspace{min-width:0;position:relative;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 30%,#171717 0,#090909 50%,#070707 100%)}.canvas-wrap{flex:1;min-height:0;overflow:auto;padding:35px}.canvas{position:relative;width:1100px;height:680px;margin:auto;background:#090909;border:1px solid #292929;box-shadow:0 30px 100px #000;border-radius:16px;overflow:hidden}.grid{position:absolute;inset:0;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:40px 40px;opacity:.04;pointer-events:none}.el{position:absolute;display:flex;white-space:pre-wrap;user-select:none;transition:outline .15s,filter .15s;overflow:hidden}.el.editing{outline:1px dashed var(--accent);outline-offset:5px}.el:hover{filter:brightness(1.08)}.el.heading{font-weight:900;line-height:.95}.el.text{line-height:1.35}.el.button{align-items:center;justify-content:center;font-weight:900;box-shadow:0 15px 45px #0008}.el.card{border:1px solid #fff1;align-items:flex-start;line-height:1.15}.el.circle{border-radius:50%}.el.image{padding:0}.el.image img{width:100%;height:100%;object-fit:cover}.el.divider{height:6px}.anim-float{animation:float 4s ease-in-out infinite}.anim-pulse{animation:pulse 2s ease-in-out infinite}.anim-spin{animation:spin 7s linear infinite}.anim-rise{animation:rise .8s ease-out both}.anim-wiggle{animation:wiggle 2.5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}@keyframes pulse{50%{transform:scale(1.04)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(18px)}}@keyframes wiggle{25%{transform:rotate(2deg)}75%{transform:rotate(-2deg)}}.selection{position:absolute;left:0;top:-25px;background:var(--accent);color:#000;padding:4px 7px;border-radius:999px;font-size:8px;font-weight:900;letter-spacing:.1em}
.voice{padding:5px 2px 16px;text-align:center;border-bottom:1px solid var(--line)}.mic{width:76px;height:76px;border-radius:50%;border:1px solid #39451e;background:var(--accent);color:#000;font-weight:900;font-size:20px;margin:4px auto 10px;display:block}.mic.listening{animation:pulse 1s infinite;box-shadow:0 0 0 10px #c8ff4414}.voice strong{display:block;font-size:10px;letter-spacing:.15em}.voice small{display:block;color:#666;font-size:9px;line-height:1.4;margin:6px auto;max-width:210px}.command{display:flex;gap:5px;margin:12px 0}.command input,.field input,.field select{width:100%;background:#0c0c0c;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px;font-size:9px;outline:none}.command input:focus,.field input:focus,.field select:focus{border-color:#53651e}.command button{background:var(--accent);border:0;border-radius:8px;padding:0 12px;font-weight:900;font-size:9px}.quick{display:flex;flex-wrap:wrap;gap:5px}.quick button{background:#111;border:1px solid var(--line);color:#999;border-radius:999px;padding:6px 8px;font-size:8px}.inspector{margin-top:14px}.field{margin-bottom:9px}.field label{display:block;color:#777;font-size:8px;letter-spacing:.08em;margin-bottom:4px}.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}.result{border-top:1px solid var(--line);margin-top:14px;padding-top:13px;font-size:9px;color:#999;line-height:1.5}.result b{display:block;color:var(--ink);font-size:10px;margin-bottom:3px}.history{margin-top:14px}.history-item{display:flex;gap:7px;padding:7px 0;border-bottom:1px solid #fff08;font-size:8px;color:#777}.history-item span{color:#444}.bottom{border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 14px;font-size:8px;color:#555;letter-spacing:.08em}.status{color:#aaa}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:20px}.modal>div{width:min(760px,100%);max-height:80vh;overflow:auto;background:#0d0d0d;border:1px solid #292929;border-radius:16px;padding:20px}.modal pre{white-space:pre-wrap;font-size:10px;color:#bbb}.hidden{display:none!important}@media(max-width:1050px){.studio{grid-template-columns:145px 1fr}.right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:14px}.workspace{grid-column:2}.left{grid-row:1/3}.right .voice{grid-column:1}.right .inspector{grid-column:2}}@media(max-width:760px){body{overflow:auto}.app{height:auto;min-height:100vh;grid-template-rows:auto auto 42px}.studio{display:flex;flex-direction:column}.left{border:0;border-bottom:1px solid var(--line);display:flex;gap:10px;overflow:auto}.toolgrid,.themes{display:flex}.tool,.theme,.page{white-space:nowrap}.workspace{min-height:700px}.right{display:block;border:0;border-top:1px solid var(--line)}.canvas-wrap{padding:15px}.canvas{transform:scale(.7);transform-origin:top left;margin-right:-330px;margin-bottom:-200px}.actions{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><i class="dot"></i><div><b>THE WEBSITE IN PROGRESS</b><span>VOICE-FIRST WEBSITE CONSTRUCTION SYSTEM</span></div></div><div class="actions"><button class="btn" id="undo">UNDO</button><button class="btn" id="redo">REDO</button><button class="btn" id="help">COMMANDS</button><button class="btn primary" id="preview">PREVIEW</button><button class="btn" id="export">EXPORT</button></div></header>
<div class="studio">
<aside class="rail left"><div><div class="label">PAGES</div><div id="pages" class="pages"></div><div class="label">ADD</div><div class="toolgrid" id="tools"></div><div class="label" style="margin-top:22px">THEMES</div><div class="themes" id="themes"></div></div></aside>
<main class="workspace"><div class="canvas-wrap"><div id="canvas" class="canvas"><div class="grid"></div></div></div></main>
<aside class="rail right">
<section class="voice"><button class="mic" id="mic">◉</button><strong id="voiceTitle">TALK TO BUILD</strong><small id="voiceCopy">Say “add a red button called ENTER” or type a command below.</small><div class="command"><input id="command" placeholder="Tell the website what to do…"><button id="run">BUILD</button></div><div class="quick" id="quick"></div></section>
<section class="inspector"><div class="label">SELECTED ELEMENT</div><div id="inspectorBody"></div><div class="label" style="margin-top:18px">BUILD LOG</div><div id="history"></div></section>
</aside>
</div>
<footer class="bottom"><span>LOCAL BUILDER</span><span>•</span><span class="status" id="status">READY</span><span style="margin-left:auto">YOUR VOICE → YOUR RULES → YOUR WEBSITE</span></footer>
</div>
<div id="modal" class="modal hidden"><div><div style="display:flex;justify-content:space-between;align-items:center"><b id="modalTitle">PREVIEW</b><button class="btn" id="closeModal">CLOSE</button></div><div id="modalBody" style="margin-top:15px"></div></div></div>
<script>
const themes=[
{name:"VOID",bg:"#090909",surface:"#101010",ink:"#f5f2ea",accent:"#c8ff44"},
{name:"OCEAN",bg:"#051316",surface:"#0b2025",ink:"#e9fbff",accent:"#5ee7ff"},
{name:"CREAM",bg:"#efe8dc",surface:"#fffaf2",ink:"#17130e",accent:"#ff5d3d"},
{name:"BLOOD",bg:"#160606",surface:"#230a0a",ink:"#fff5f3",accent:"#ff4f4f"},
{name:"VIOLET",bg:"#0e091a",surface:"#191025",ink:"#f4edff",accent:"#b993ff"}];
const starter=()=>({id:crypto.randomUUID(),name:"Home",bg:themes[0].bg,elements:[
el("heading","YOUR WEBSITE\nSTARTS HERE.",90,80,650,170,74,0,"transparent",themes[0].ink,"rise"),
el("text","Say what you want. The canvas will change.",94,285,520,80,24,0,"transparent","#aaa","none"),
el("button","SPEAK TO BUILD",94,405,250,72,20,999,themes[0].accent,"#050505","pulse"),
el("card","Try:\n“add a red button here”",610,350,330,180,20,28,themes[0].surface,themes[0].ink,"float")]});
function el(kind,text,x,y,w,h,size,radius,bg,color,animation="none"){return{id:crypto.randomUUID(),kind,text,x,y,w,h,size,radius,bg,color,animation,src:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=900&q=80"}}
let state={pages:[starter()],page:0,selected:null,theme:themes[0]};
let undo=[],redo=[],log=[];
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("wip-state",JSON.stringify(state));localStorage.setItem("wip-log",JSON.stringify(log))}
try{const s=JSON.parse(localStorage.getItem("wip-state"));if(s?.pages)state=s}catch{}
try{log=JSON.parse(localStorage.getItem("wip-log"))||[]}catch{}
function snap(){undo.push(JSON.stringify(state));if(undo.length>30)undo.shift();redo=[]}
function current(){return state.pages[state.page]}
function selected(){return current().elements.find(e=>e.id===state.selected)}
function color(v){const m={red:"#ff4d4d",blue:"#4da3ff",green:"#64e572",yellow:"#ffe14d",purple:"#b993ff",pink:"#ff78b8",orange:"#ff8f4d",white:"#fff",black:"#070707"};return /^#[0-9a-f]{3,8}$/i.test(v)?v:m[v.toLowerCase()]||null}
function add(kind,text="New element"){snap();const n=current().elements.length;const x=100+(n*29)%400,y=100+(n*37)%400;const e=el(kind,text,x,y,kind==="heading"?620:kind==="circle"?180:kind==="button"?250:320,kind==="heading"?130:kind==="circle"?180:kind==="divider"?6:110,kind==="heading"?60:kind==="text"?24:kind==="button"?20:20,kind==="circle"||kind==="button"?999:22,kind==="button"?state.theme.accent:kind==="card"?"#171717":"transparent",kind==="button"?"#050505":state.theme.ink,kind==="card"?"float":kind==="heading"?"rise":"none");current().elements.push(e);state.selected=e.id;record("Added "+kind);render()}
function record(s){log.unshift(s);log=log.slice(0,12);save();$("status").textContent=s.toUpperCase()}
function command(raw){let s=raw.trim(),l=s.toLowerCase();if(!s)return;
if(/^(undo|go back)/.test(l)){undoAction();return}
if(/^(redo)/.test(l)){redoAction();return}
if(/reset|start over|clear everything/.test(l)){snap();state.pages=[starter()];state.page=0;state.selected=null;record("Reset canvas");render();return}
if(/new page|create a page|new screen|create a screen/.test(l)){snap();let m=s.match(/(?:called|named)\s+[“"]?([^”"]+)/i);state.pages.push({id:crypto.randomUUID(),name:m?m[1].trim():"Page "+(state.pages.length+1),bg:state.theme.bg,elements:[]});state.page=state.pages.length-1;state.selected=null;record("Created page");render();return}
if(/^(go to|open|show) /.test(l)){let name=s.replace(/^(go to|open|show) (the )?(page|screen)?\s*/i,"").trim().replace(/[“"]/g,"");let i=state.pages.findIndex(p=>p.name.toLowerCase()===name.toLowerCase());if(i>=0){snap();state.page=i;state.selected=null;record("Opened "+name);render();return}}
let sel=selected();
if(/delete|remove/.test(l)&&sel){snap();current().elements=current().elements.filter(e=>e.id!==sel.id);state.selected=null;record("Deleted element");render();return}
if(/duplicate|copy/.test(l)&&sel){snap();let c={...sel,id:crypto.randomUUID(),x:sel.x+28,y:sel.y+28};current().elements.push(c);state.selected=c.id;record("Duplicated element");render();return}
if(/stop .*animation|no animation/.test(l)&&sel){snap();sel.animation="none";record("Stopped animation");render();return}
let anim=l.match(/\b(float|pulse|spin|rise|wiggle)\b/);if(anim&&sel){snap();sel.animation=anim[1];record("Animation: "+anim[1]);render();return}
let col=s.match(/(?:make|change|set).*(?:to|color)\s+(#[0-9a-f]{3,8}|red|blue|green|yellow|purple|pink|orange|white|black)\b/i);if(col&&sel){snap();let c=color(col[1]);sel.kind==="button"||sel.kind==="card"||sel.kind==="circle"||sel.kind==="image"?sel.bg=c:sel.color=c;record("Changed color");render();return}
if(/background/.test(l)){let m=s.match(/(?:to|background)\s+(#[0-9a-f]{3,8}|red|blue|green|yellow|purple|pink|orange|white|black)/i);if(m){snap();let c=color(m[1]);state.theme={...state.theme,bg:c};current().bg=c;record("Changed background");render();return}}
if(sel&&/full width/.test(l)){snap();sel.w=1000;sel.x=50;record("Made full width");render();return}
if(sel&&/center/.test(l)){snap();sel.x=550-sel.w/2;record("Centered element");render();return}
if(sel&&/move .*right|top right/.test(l)){snap();sel.x=1050-sel.w;sel.y=60;record("Moved top right");render();return}
if(sel&&/move .*left|top left/.test(l)){snap();sel.x=40;sel.y=60;record("Moved top left");render();return}
if(sel&&/move .*down|bottom/.test(l)){snap();sel.y=600-sel.h;record("Moved down");render();return}
let size=s.match(/(?:size|font size)\s*(?:to)?\s*(\d+)/i);if(sel&&size){snap();sel.size=+size[1];record("Changed size");render();return}
let textm=s.match(/(?:heading|text|button|card)\s+(?:that )?(?:says|called|reading)\s+[“"]?([^”"]+)[”"]?/i);
let kindm=l.match(/\b(add|create|make)\s+(?:a |an )?(heading|text|button|card|circle|image|divider)\b/);
if(kindm){let kind=kindm[2];let t=textm?.[1]||({heading:"NEW HEADING",text:"New text",button:"CLICK ME",card:"New card",circle:"",image:"",divider:""}[kind]);add(kind,t);return}
if(sel&&/change.*text|rename|say/.test(l)){let m=s.match(/(?:to|say|text)\s+[“"]?([^”"]+)/i);if(m){snap();sel.text=m[1].trim();record("Changed text");render();return}}
if(/make a website|build a website|create a website/.test(l)){snap();state.pages=[{id:crypto.randomUUID(),name:"Home",bg:state.theme.bg,elements:[el("heading","A WEBSITE\nMADE FROM WORDS.",90,80,720,170,72,0,"transparent",state.theme.ink,"rise"),el("text","You described it. It exists.",94,280,520,80,26,0,"transparent","#aaa","none"),el("button","ENTER",94,400,220,70,20,999,state.theme.accent,"#050505","pulse"),el("card","Your next instruction changes the world.",600,360,340,180,20,26,state.theme.surface,state.theme.ink,"float")]}];state.page=0;state.selected=null;record("Generated a website");render();return}
record("I heard: "+s);render()}
function render(){document.documentElement.style.setProperty("--bg",state.theme.bg);document.documentElement.style.setProperty("--ink",state.theme.ink);document.documentElement.style.setProperty("--accent",state.theme.accent);$("pages").innerHTML=state.pages.map((p,i)=>'<button class="page '+(i===state.page?"active":"")+'" onclick="goPage('+i+')">'+p.name+'</button>').join("");
$("tools").innerHTML=["heading","text","button","card","circle","image","divider"].map(k=>'<button class="tool" onclick="add(\''+k+'\')">+'+k.toUpperCase()+'</button>').join("");
$("themes").innerHTML=themes.map((t,i)=>'<button class="theme" onclick="setTheme('+i+')"><i class="swatch" style="background:'+t.accent+'"></i>'+t.name+'</button>').join("");
let c=$("canvas");c.style.background=current().bg;c.innerHTML='<div class="grid"></div>'+current().elements.map(e=>'<div class="el '+e.kind+' '+(e.animation!=="none"?"anim-"+e.animation:"")+' '+(e.id===state.selected?"editing":"")+'" data-id="'+e.id+'" style="left:'+e.x+'px;top:'+e.y+'px;width:'+e.w+'px;height:'+e.h+'px;color:'+e.color+';background:'+e.bg+';font-size:'+e.size+'px;border-radius:'+e.radius+'px;justify-content:'+({left:"flex-start",center:"center",right:"flex-end"}[e.align||"left"])+';align-items:'+(e.kind==="button"||e.kind==="circle"?"center":"flex-start")+'" onclick="selectEl(event,\''+e.id+'\')">'+(e.id===state.selected?'<span class="selection">'+e.kind.toUpperCase()+'</span>':"")+(e.kind==="image"?'<img src="'+e.src+'">':e.text)+'</div>').join("");
renderInspector();$("history").innerHTML=log.map((x,i)=>'<div class="history-item"><span>0'+(i+1)+'</span><b>'+x+'</b></div>').join("");save()}
function renderInspector(){let e=selected();if(!e){$("inspectorBody").innerHTML='<div style="font-size:9px;color:#666;line-height:1.5">Select something on the canvas, then tell it what to become.</div>';return}
$("inspectorBody").innerHTML='<div class="field"><label>TEXT</label><input id="itext" value="'+escapeAttr(e.text)+'"></div><div class="two"><div class="field"><label>X</label><input id="ix" type="number" value="'+e.x+'"></div><div class="field"><label>Y</label><input id="iy" type="number" value="'+e.y+'"></div></div><div class="two"><div class="field"><label>WIDTH</label><input id="iw" type="number" value="'+e.w+'"></div><div class="field"><label>HEIGHT</label><input id="ih" type="number" value="'+e.h+'"></div></div><div class="two"><div class="field"><label>FONT</label><input id="isize" type="number" value="'+e.size+'"></div><div class="field"><label>RADIUS</label><input id="ir" type="number" value="'+e.radius+'"></div></div><div class="field"><label>ANIMATION</label><select id="ianim">'+["none","float","pulse","spin","rise","wiggle"].map(a=>'<option '+(e.animation===a?"selected":"")+'>'+a+'</option>').join("")+'</select></div><button class="btn" style="width:100%" onclick="applyInspector()">APPLY CHANGES</button><button class="btn" style="width:100%;margin-top:6px;color:#ff7777" onclick="deleteSelected()">DELETE ELEMENT</button>'}
function escapeAttr(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function applyInspector(){let e=selected();if(!e)return;snap();e.text=$("itext").value;e.x=+$("ix").value;e.y=+$("iy").value;e.w=+$("iw").value;e.h=+$("ih").value;e.size=+$("isize").value;e.radius=+$("ir").value;e.animation=$("ianim").value;record("Updated selected element");render()}
function deleteSelected(){command("delete this")}
function selectEl(ev,id){ev.stopPropagation();state.selected=id;render()}
function goPage(i){snap();state.page=i;state.selected=null;record("Opened "+state.pages[i].name);render()}
function setTheme(i){snap();state.theme=themes[i];current().bg=themes[i].bg;current().elements.forEach(e=>{if(e.kind==="button")e.bg=themes[i].accent});record("Theme: "+themes[i].name);render()}
function undoAction(){if(!undo.length)return;redo.push(JSON.stringify(state));state=JSON.parse(undo.pop());record("Undo");render()}
function redoAction(){if(!redo.length)return;undo.push(JSON.stringify(state));state=JSON.parse(redo.pop());record("Redo");render()}
function exportHTML(){let p=current();let body=p.elements.map(e=>'<div style="position:absolute;left:'+e.x+'px;top:'+e.y+'px;width:'+e.w+'px;height:'+e.h+'px;color:'+e.color+';background:'+e.bg+';font-size:'+e.size+'px;border-radius:'+e.radius+'px;display:flex;align-items:center;padding:12px;white-space:pre-wrap">'+(e.kind==="image"?'<img style="width:100%;height:100%;object-fit:cover" src="'+e.src+'">':e.text)+'</div>').join("");let out='<!doctype html><html><body style="margin:0;background:'+p.bg+';color:#fff"><main style="position:relative;width:1100px;height:680px;margin:auto;overflow:hidden">'+body+'</main></body></html>';let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out],{type:"text/html"}));a.download="my-voice-built-website.html";a.click();record("Exported HTML")}
$("run").onclick=()=>command($("command").value);$("command").addEventListener("keydown",e=>{if(e.key==="Enter"){command(e.target.value);e.target.value=""}});
$("undo").onclick=undoAction;$("redo").onclick=redoAction;$("help").onclick=()=>{$("modalTitle").textContent="VOICE COMMANDS";$("modalBody").innerHTML='<pre>ADD: “add a red button called ENTER”\nEDIT: “make it blue”, “make it full width”, “move it top right”, “make it centered”, “font size 48”\nSTYLE: “make it float / pulse / spin / wiggle”\nPAGES: “create a page called Gallery”, “open Gallery”\nCONTENT: “change text to HELLO WORLD”\nCONTROL: “duplicate this”, “delete this”, “reset everything”\nBACKGROUND: “change the background to blue”\nWEBSITE: “make a website about space”</pre>';$("modal").classList.remove("hidden")};
$("closeModal").onclick=()=>{$("modal").classList.add("hidden")};$("preview").onclick=()=>{let old=state.selected;state.selected=null;render();$("modalTitle").textContent="PREVIEW";$("modalBody").innerHTML='<div id="previewCanvas" style="position:relative;width:100%;height:500px;background:'+current().bg+';overflow:hidden;border-radius:12px">'+current().elements.map(e=>'<div style="position:absolute;left:'+e.x/1.45+'px;top:'+e.y/1.45+'px;width:'+e.w/1.45+'px;height:'+e.h/1.45+'px;color:'+e.color+';background:'+e.bg+';font-size:'+e.size/1.45+'px;border-radius:'+e.radius+'px;display:flex;align-items:center;padding:10px;white-space:pre-wrap">'+(e.kind==="image"?'<img style="width:100%;height:100%;object-fit:cover" src="'+e.src+'">':e.text)+'</div>').join("")+'</div>';$("modal").classList.remove("hidden");state.selected=old;render()};
$("export").onclick=exportHTML;
let rec=null,listening=false;if(window.SpeechRecognition||window.webkitSpeechRecognition){let C=window.SpeechRecognition||window.webkitSpeechRecognition;rec=new C();rec.continuous=false;rec.interimResults=false;rec.lang="en-US";rec.onresult=e=>{let t=e.results[0][0].transcript;$("command").value=t;command(t)};rec.onend=()=>{listening=false;$("mic").classList.remove("listening");$("voiceTitle").textContent="TALK TO BUILD"};rec.onerror=()=>{listening=false;$("mic").classList.remove("listening");$("voiceTitle").textContent="VOICE UNAVAILABLE"}}
$("mic").onclick=()=>{if(!rec){$("voiceTitle").textContent="USE TYPING";return}if(listening){rec.stop()}else{listening=true;$("mic").classList.add("listening");$("voiceTitle").textContent="LISTENING…";rec.start()}};
$("canvas").addEventListener("click",()=>{state.selected=null;render()});
$("quick").innerHTML=["add a button","add a heading","make it blue","make it float","create a page","make a website"].map(x=>'<button onclick="command(\''+x+'\')">'+x+'</button>').join("");
render();
</script>
