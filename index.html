<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website in Progress — AI Design Studio</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#171717;--muted:#777;--line:#e7e7e3;--accent:#111;--blue:#4263eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{height:100vh;display:grid;grid-template-rows:58px 1fr}
header{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#fff}.brand{display:flex;align-items:center;gap:10px}.logo{width:28px;height:28px;border-radius:8px;background:#111;color:#fff;display:grid;place-items:center;font-weight:900}.brand b{font-size:13px}.brand span{display:block;color:#999;font-size:10px;margin-top:2px}.top-actions{display:flex;gap:7px}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:11px}.btn.dark{background:#111;color:#fff;border-color:#111}.studio{display:grid;grid-template-columns:210px 1fr 290px;min-height:0}.left,.right{background:#fff;min-height:0;overflow:auto}.left{border-right:1px solid var(--line);padding:14px}.right{border-left:1px solid var(--line);padding:14px}.section{margin-bottom:22px}.label{font-size:10px;color:#999;font-weight:700;letter-spacing:.08em;margin-bottom:9px}.project{padding:10px;border:1px solid var(--line);border-radius:9px;background:#fafafa}.project strong{font-size:12px}.project small{display:block;color:#999;margin-top:3px}.page{width:100%;border:0;background:transparent;text-align:left;padding:9px;border-radius:7px;color:#555;margin-bottom:2px}.page.active{background:#f0f0ed;color:#111;font-weight:700}.newpage{width:100%;border:1px dashed #ccc;background:#fff;border-radius:7px;padding:8px;color:#777}.canvas-area{min-width:0;display:flex;flex-direction:column;background:#f1f1ee}.canvasbar{height:48px;display:flex;align-items:center;justify-content:center;gap:8px;color:#888}.canvasbar button{border:1px solid #ddd;background:#fff;border-radius:7px;padding:6px 10px}.viewport{flex:1;overflow:auto;padding:38px}.canvas{position:relative;width:1100px;height:700px;margin:auto;background:#fff;box-shadow:0 12px 45px #00000012;border:1px solid #ddd;border-radius:4px;overflow:hidden}.grid{position:absolute;inset:0;background-image:linear-gradient(#00000008 1px,transparent 1px),linear-gradient(90deg,#00000008 1px,transparent 1px);background-size:20px 20px}.el{position:absolute;display:flex;white-space:pre-wrap;overflow:hidden;transition:outline .12s;user-select:none}.el.selected{outline:2px solid var(--blue);outline-offset:3px}.heading{font-weight:850;line-height:.98}.text{line-height:1.45}.button{align-items:center;justify-content:center;font-weight:750}.card{border:1px solid #ddd;align-items:flex-start;line-height:1.25}.circle{border-radius:50%}.divider{height:2px}.anim-float{animation:float 4s ease-in-out infinite}.anim-pulse{animation:pulse 2s ease-in-out infinite}.anim-spin{animation:spin 6s linear infinite}@keyframes float{50%{transform:translateY(-8px)}}@keyframes pulse{50%{transform:scale(1.04)}}@keyframes spin{to{transform:rotate(360deg)}}.ai{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fafafa}.ai-head{display:flex;gap:9px;align-items:center}.ai-dot{width:9px;height:9px;background:#6b7cff;border-radius:50%;box-shadow:0 0 14px #6b7cff}.ai b{font-size:12px}.ai small{color:#999}.prompt{display:flex;gap:6px;margin-top:12px}.prompt input{flex:1;border:1px solid #ddd;border-radius:8px;padding:9px 10px;outline:none}.prompt button{border:0;background:#111;color:#fff;border-radius:8px;padding:0 13px}.mic{width:100%;margin-top:7px;border:1px solid #ddd;background:#fff;border-radius:8px;padding:8px}.quick{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.quick button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:6px 8px;font-size:10px}.field{margin:10px 0}.field label{display:block;font-size:9px;color:#999;margin-bottom:4px}.field input,.field select{width:100%;border:1px solid #ddd;border-radius:7px;padding:8px;background:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}.log{font-size:10px;color:#888;border-top:1px solid var(--line);padding-top:8px}.log div{padding:6px 0;border-bottom:1px solid #f0f0ed}.empty{color:#aaa;font-size:11px;line-height:1.5}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 13px;border-radius:999px;font-size:11px;display:none;z-index:20}.toast.show{display:block}@media(max-width:1000px){.studio{grid-template-columns:180px 1fr}.right{grid-column:1/-1;border:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr}.canvas-area{grid-column:2;grid-row:1}.left{grid-row:1/3}}@media(max-width:700px){.studio{display:flex;flex-direction:column}.canvas-area{min-height:720px}.right{display:block}.left{border:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;gap:15px}.left .section{min-width:170px}}
</style></head>
<body><div class="app">
<header><div class="brand"><div class="logo">W</div><div><b>Website in Progress</b><span>AI DESIGN STUDIO · VOICE FIRST</span></div></div><div class="top-actions"><button class="btn" onclick="undo()">Undo</button><button class="btn" onclick="redo()">Redo</button><button class="btn" onclick="preview()">Preview</button><button class="btn dark" onclick="exportSite()">Export</button></div></header>
<div class="studio">
<aside class="left">
<div class="section"><div class="label">PROJECT</div><div class="project"><strong>Untitled Website</strong><small>Local project · autosaved</small></div></div>
<div class="section"><div class="label">PAGES</div><div id="pages"></div><button class="newpage" onclick="newPage()">+ New page</button></div>
<div class="section"><div class="label">INSERT</div><div class="two" id="insert"></div></div>
</aside>
<main class="canvas-area"><div class="canvasbar"><span>100%</span><button onclick="fit()">Fit</button><button onclick="clearSelection()">Select none</button></div><div class="viewport"><div class="canvas" id="canvas"><div class="grid"></div></div></div></main>
<aside class="right">
<div class="section"><div class="ai"><div class="ai-head"><i class="ai-dot"></i><div><b>Build with AI</b><small>Describe what you want to change</small></div></div><div class="prompt"><input id="prompt" placeholder="e.g. add a hero with a blue button"><button onclick="run()">Build</button></div><button class="mic" id="mic" onclick="listen()">🎙 Talk to build</button><div class="quick" id="quick"></div></div></div>
<div class="section"><div class="label">INSPECTOR</div><div id="inspector" class="empty">Select an element on the canvas to edit it.</div></div>
<div class="section"><div class="label">ACTIVITY</div><div id="log" class="log"></div></div>
</aside></div></div><div id="toast" class="toast"></div>
<script>
const types=['heading','text','button','card','circle','divider'];let history=[],future=[],logs=[];
const make=(kind,text,x,y,w,h,size=18,bg='#fff',color='#111')=>({id:crypto.randomUUID(),kind,text,x,y,w,h,size,bg,color,radius:kind==='button'?10:kind==='circle'?999:8,animation:'none'});
const starter=()=>({name:'Home',bg:'#fff',elements:[make('heading','Build your website\nwith words.',90,100,650,150,68,'transparent','#111'),make('text','Describe a section, a style, or an interaction.\nThe canvas updates immediately.',95,285,530,90,20,'transparent','#666'),make('button','Start building',95,410,190,58,16,'#111','#fff'),make('card','A real editable canvas\nnot a static mockup.',600,360,300,150,19,'#f7f7f5','#111')]});
let state={pages:[starter()],page:0,selected:null};
try{const x=JSON.parse(localStorage.getItem('wip-pro'));if(x?.pages)state=x}catch{}
const $=id=>document.getElementById(id),cur=()=>state.pages[state.page],sel=()=>cur().elements.find(e=>e.id===state.selected);
function save(){localStorage.setItem('wip-pro',JSON.stringify(state));}
function checkpoint(){history.push(JSON.stringify(state));if(history.length>40)history.shift();future=[]}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1400)}
function log(t){logs.unshift(t);logs=logs.slice(0,10);$('log').innerHTML=logs.map(x=>'<div>'+x+'</div>').join('');save()}
function render(){
 $('pages').innerHTML=state.pages.map((p,i)=>'<button class="page '+(i===state.page?'active':'')+'" onclick="goPage('+i+')">'+p.name+'</button>').join('');
 $('insert').innerHTML=types.map(k=>'<button class="btn" onclick="add(\''+k+'\')">+'+k+'</button>').join('');
 $('quick').innerHTML=['add a heading','add a button','add a card','make it blue','make it float'].map(x=>'<button onclick="command(\''+x+'\')">'+x+'</button>').join('');
 const c=$('canvas');c.style.background=cur().bg;c.innerHTML='<div class="grid"></div>'+cur().elements.map(e=>'<div class="el '+e.kind+' '+(e.animation!=='none'?'anim-'+e.animation:'')+' '+(e.id===state.selected?'selected':'')+'" style="left:'+e.x+'px;top:'+e.y+'px;width:'+e.w+'px;height:'+e.h+'px;background:'+e.bg+';color:'+e.color+';font-size:'+e.size+'px;border-radius:'+e.radius+'px;padding:'+(e.kind==='button'?'0':'12px')+'" onclick="pick(event,\''+e.id+'\')">'+e.text+'</div>').join('');
 $('inspector').innerHTML=sel()?inspector(sel()):'<div class="empty">Select an element on the canvas to edit it.</div>';save();
}
function inspector(e){return '<div class="field"><label>CONTENT</label><input id="t" value="'+String(e.text).replace(/"/g,'&quot;')+'"></div><div class="two"><div class="field"><label>X</label><input id="x" type="number" value="'+e.x+'"></div><div class="field"><label>Y</label><input id="y" type="number" value="'+e.y+'"></div></div><div class="two"><div class="field"><label>WIDTH</label><input id="w" type="number" value="'+e.w+'"></div><div class="field"><label>HEIGHT</label><input id="h" type="number" value="'+e.h+'"></div></div><div class="two"><div class="field"><label>FONT</label><input id="s" type="number" value="'+e.size+'"></div><div class="field"><label>RADIUS</label><input id="r" type="number" value="'+e.radius+'"></div></div><div class="field"><label>ANIMATION</label><select id="a">'+['none','float','pulse','spin'].map(x=>'<option '+(x===e.animation?'selected':'')+'>'+x+'</option>').join('')+'</select></div><button class="btn dark" style="width:100%" onclick="apply()">Apply changes</button><button class="btn" style="width:100%;margin-top:6px" onclick="del()">Delete</button>'}
function add(k,text){checkpoint();const n=cur().elements.length,e=make(k,text||({heading:'New heading',text:'New text',button:'Button',card:'New card',circle:'',divider:''}[k]),80+(n*35)%500,80+(n*42)%450,k==='heading'?600:k==='circle'?150:k==='button'?190:300,k==='heading'?120:k==='circle'?150:k==='divider'?2:100,k==='heading'?54:k==='text'?20:17,k==='button'?'#111':k==='card'?'#f7f7f5':'transparent',k==='button'?'#fff':'#111');cur().elements.push(e);state.selected=e.id;log('Added '+k);render()}
function pick(ev,id){ev.stopPropagation();state.selected=id;render()}
function clearSelection(){state.selected=null;render()}
function apply(){const e=sel();if(!e)return;checkpoint();e.text=$('t').value;e.x=+$('x').value;e.y=+$('y').value;e.w=+$('w').value;e.h=+$('h').value;e.size=+$('s').value;e.radius=+$('r').value;e.animation=$('a').value;log('Updated element');render()}
function del(){if(!sel())return;checkpoint();cur().elements=cur().elements.filter(e=>e.id!==state.selected);state.selected=null;log('Deleted element');render()}
function goPage(i){checkpoint();state.page=i;state.selected=null;render()}
function newPage(){checkpoint();state.pages.push({name:'Page '+(state.pages.length+1),bg:'#fff',elements:[]});state.page=state.pages.length-1;render();log('Created page')}
function command(s){s=s.trim();const l=s.toLowerCase();let e=sel();if(!s)return;
if(l.includes('undo'))return undo();if(l.includes('redo'))return redo();if(l.includes('delete')&&e)return del();
let m=l.match(/add (?:a |an )?(heading|text|button|card|circle|divider)/);if(m){let text=s.match(/(?:called|says|reading)\s+["“]?([^"”]+)["”]?/i)?.[1];return add(m[1],text)}
if(e&&/float|pulse|spin/.test(l)){checkpoint();e.animation=l.match(/float|pulse|spin/)[0];log('Changed animation');render();return}
if(e&&l.includes('center')){checkpoint();e.x=(1100-e.w)/2;e.y=(700-e.h)/2;log('Centered element');render();return}
if(e&&l.includes('full width')){checkpoint();e.x=40;e.w=1020;log('Made full width');render();return}
if(e&&l.includes('blue')){checkpoint();e.bg='#4263eb';e.color='#fff';log('Changed to blue');render();return}
if(l.includes('background')){let col=l.includes('blue')?'#eef2ff':l.includes('black')?'#111':'#fff';checkpoint();cur().bg=col;log('Changed background');render();return}
if(l.includes('website')||l.includes('hero')){checkpoint();cur().elements=[make('heading','Your next idea\nstarts here.',90,100,700,150,70,'transparent','#111'),make('text','A polished responsive experience generated from your instructions.',95,290,560,70,19,'transparent','#666'),make('button','Get started',95,390,180,56,16,'#111','#fff'),make('card','Designed in real time.\nEdited with natural language.',600,350,320,170,19,'#f5f5f3','#111')];log('Generated a new composition');render();return}
log('Command received: '+s);toast('I understood the command — try a more specific edit.')}
function run(){const p=$('prompt');command(p.value);p.value=''}
function undo(){if(!history.length)return;future.push(JSON.stringify(state));state=JSON.parse(history.pop());log('Undo');render()}
function redo(){if(!future.length)return;history.push(JSON.stringify(state));state=JSON.parse(future.pop());log('Redo');render()}
function fit(){document.querySelector('.viewport').scrollTo({left:0,top:0,behavior:'smooth'});toast('Canvas reset')}
function preview(){const old=state.selected;state.selected=null;render();toast('Preview mode — selection hidden');setTimeout(()=>{state.selected=old;render()},2200)}
function exportSite(){const p=cur();const body=p.elements.map(e=>'<div style="position:absolute;left:'+e.x+'px;top:'+e.y+'px;width:'+e.w+'px;height:'+e.h+'px;background:'+e.bg+';color:'+e.color+';font-size:'+e.size+'px;border-radius:'+e.radius+'px;padding:12px;display:flex;align-items:center;white-space:pre-wrap">'+e.text+'</div>').join('');const html='<!doctype html><html><body style="margin:0;background:'+p.bg+'"><main style="position:relative;width:1100px;height:700px;margin:auto;overflow:hidden">'+body+'</main></body></html>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='website.html';a.click();toast('HTML exported')}
function listen(){const C=window.SpeechRecognition||window.webkitSpeechRecognition;if(!C){toast('Voice recognition is not supported here');return}const r=new C();r.lang='en-US';r.onstart=()=>{$('mic').textContent='Listening…'};r.onresult=e=>command(e.results[0][0].transcript);r.onend=()=>{$('mic').textContent='🎙 Talk to build'};r.start()}
$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter')run()});$('canvas').addEventListener('click',clearSelection);render();log('Studio ready');
</script></body></html>
