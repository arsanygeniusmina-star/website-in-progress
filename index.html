<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070707">
<title>404 — Nothing Here</title>
<style>
:root{--bg:#070707;--fg:#f4f4f0;--muted:#777;--line:#242424;--accent:#ff3b30}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
.page{min-height:100vh;position:relative;display:grid;place-items:center;overflow:hidden;background:
radial-gradient(circle at 50% 50%,rgba(255,255,255,.045),transparent 31%),
radial-gradient(circle at 85% 15%,rgba(255,59,48,.08),transparent 24%),#070707}
.grid{position:absolute;inset:-20%;opacity:.45;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;transform:perspective(800px) rotateX(62deg) scale(1.5);transform-origin:center;animation:grid 18s linear infinite}
.noise{position:absolute;inset:0;opacity:.07;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E")}
.orb{position:absolute;width:34vw;height:34vw;min-width:260px;min-height:260px;border:1px solid rgba(255,255,255,.08);border-radius:50%;animation:orb 12s ease-in-out infinite}
.orb:before,.orb:after{content:"";position:absolute;inset:12%;border:1px solid rgba(255,255,255,.055);border-radius:50%}
.orb:after{inset:25%;border-color:rgba(255,59,48,.14)}
.content{position:relative;z-index:2;width:min(920px,90vw);text-align:center}
.kicker{display:inline-flex;align-items:center;gap:9px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;color:#aaa;font-size:10px;letter-spacing:.16em;text-transform:uppercase;background:rgba(255,255,255,.025);backdrop-filter:blur(12px);animation:rise .8s both}
.dot{width:6px;height:6px;background:var(--accent);border-radius:50%;box-shadow:0 0 18px rgba(255,59,48,.8)}
.code{margin:20px 0 0;font-size:clamp(120px,25vw,310px);font-weight:900;letter-spacing:-.09em;line-height:.72;user-select:none;color:#f4f4f0;text-shadow:0 0 60px rgba(255,255,255,.05);animation:rise .9s .08s both}
.code span{display:inline-block}
.code .zero{position:relative;color:transparent;-webkit-text-stroke:1px #555}
.code .zero:before{content:"";position:absolute;width:25%;height:25%;left:37.5%;top:37.5%;border-radius:50%;background:var(--accent);box-shadow:0 0 70px rgba(255,59,48,.28);animation:pulse 2.4s ease-in-out infinite}
h1{margin:38px 0 10px;font-size:clamp(28px,5vw,58px);letter-spacing:-.055em;line-height:1;font-weight:800;animation:rise .9s .18s both}
p{margin:0 auto;color:#858585;max-width:520px;font-size:14px;line-height:1.7;animation:rise .9s .25s both}
.actions{display:flex;justify-content:center;gap:9px;margin-top:28px;animation:rise .9s .32s both}
a{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--fg);border:1px solid #303030;border-radius:999px;padding:11px 17px;font-size:12px;font-weight:700;background:rgba(255,255,255,.035);transition:.25s}
a.primary{background:var(--fg);color:#080808;border-color:var(--fg)}
a:hover{transform:translateY(-3px);border-color:#555}
a.primary:hover{box-shadow:0 12px 35px rgba(255,255,255,.12)}
.corner{position:absolute;z-index:3;color:#555;font-size:9px;letter-spacing:.16em;text-transform:uppercase}
.tl{top:24px;left:26px}.tr{top:24px;right:26px}.bl{bottom:24px;left:26px}.br{bottom:24px;right:26px}
.cross{position:absolute;width:18px;height:18px;opacity:.5}
.cross:before,.cross:after{content:"";position:absolute;background:#444}
.cross:before{width:100%;height:1px;top:9px}.cross:after{height:100%;width:1px;left:9px}
.c1{top:17%;left:14%}.c2{top:28%;right:12%}.c3{bottom:19%;left:18%}.c4{bottom:13%;right:20%}
@keyframes grid{to{transform:perspective(800px) rotateX(62deg) scale(1.5) translateY(64px)}}
@keyframes orb{50%{transform:scale(1.06) rotate(8deg)}}
@keyframes pulse{50%{transform:scale(1.35);box-shadow:0 0 95px rgba(255,59,48,.42)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media(max-width:600px){body{overflow:hidden}.orb{width:88vw;height:88vw}.code{font-size:38vw}.actions{flex-direction:column;align-items:center}.actions a{width:180px}.corner{font-size:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="page">
<div class="grid"></div><div class="noise"></div><div class="orb"></div>
<div class="cross c1"></div><div class="cross c2"></div><div class="cross c3"></div><div class="cross c4"></div>
<div class="corner tl">WIP / SYSTEM</div><div class="corner tr">STATUS: LOST</div>
<div class="corner bl">404 / 001</div><div class="corner br">NOT FOUND</div>
<section class="content">
<div class="kicker"><i class="dot"></i> Route not found</div>
<div class="code" aria-label="404"><span>4</span><span class="zero">0</span><span>4</span></div>
<h1>Nothing lives here.</h1>
<p>The page you were looking for either moved, disappeared, or never existed in the first place. The rest of the internet is still out there.</p>
<div class="actions">
<a class="primary" href="/">Go home <span aria-hidden="true">&nbsp;↗</span></a>
<a href="javascript:history.back()">Go back <span aria-hidden="true">&nbsp;←</span></a>
</div>
</section>
</main>
</body>
</html>
